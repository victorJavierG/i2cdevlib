[package]
name = "my-buddhist-editor"
version = "0.1.0"
description = "Desktop study tool for Buddhist texts"
authors = ["Your Name <you@example.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "1"
anyhow = "1"

